        let currentTab = 0;

        function switchTab(index) {
            currentTab = index;
            renderTabs();
            renderEvents();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('tabs-container');
            tabsContainer.innerHTML = '';
            
            itineraryData.forEach((day, index) => {
                const isActive = index === currentTab;
                const activeClasses = isActive 
                    ? 'bg-white text-[#D97D64] shadow-sm font-semibold' 
                    : 'text-[#8A8177] hover:bg-[#E5DFD3] hover:text-[#5D534A]';
                
                const btn = document.createElement('button');
                btn.className = `flex-1 py-3 px-4 rounded-xl text-sm transition-all duration-300 whitespace-nowrap flex flex-col items-center ${activeClasses}`;
                btn.onclick = () => switchTab(index);
                
                btn.innerHTML = `
                    <span class="text-[1.05rem] mb-0.5 tracking-wide">${day.day}</span>
                    <span class="text-[0.7rem] opacity-90">${day.date}</span>
                `;
                tabsContainer.appendChild(btn);
            });
        }

            const timelineLine = document.getElementById('timeline-line');

                timelineLine.style.display = 'none';

                    infoHtml += `
                        <div class="bg-[#F4F1EA] p-4 rounded-[1rem] border border-[#EBE6DC]">
                            <h4 class="text-[#8F9E8B] font-bold text-sm mb-1"><i class="fa-solid ${info.icon} mr-1.5"></i>${info.label}</h4>
                            <p class="text-[#6C635A] text-sm leading-relaxed">${info.text}</p>
                        </div>
                    `;
                });
                infoHtml += `</div>`;
                eventsContainer.insertAdjacentHTML('beforeend', infoHtml);

                // 必買清單專區
                let mustBuyHtml = `
                    <div class="bg-[#F6F3ED] p-5 rounded-[1.5rem] border border-[#EBE6DC] mb-8">
                        <h3 class="font-bold text-[1.15rem] text-[#D97D64] mb-3 flex items-center gap-2">

                    mustBuyHtml += `
                        <div class="flex items-center gap-2 text-sm text-[#6C635A] bg-white p-2.5 rounded-xl border border-[#EFEBE0]">
                            <i class="fa-regular fa-circle-check text-[#8F9E8B]"></i>
                            <span>${item}</span>
                        </div>
                    `;
                });
                mustBuyHtml += `</div></div>`;
                eventsContainer.insertAdjacentHTML('beforeend', mustBuyHtml);

                // 亮點卡
                let highlightsHtml = `<div class="grid grid-cols-1 md:grid-cols-2 gap-6">`;
                dayData.highlights.forEach((hl, index) => {
                    highlightsHtml += `
                        <div class="bg-white p-5 rounded-[1.5rem] border border-[#EFEBE0] shadow-sm hover:shadow-md transition-shadow relative overflow-hidden group cursor-pointer" onclick="switchTab(${index+1})">

                                <i class="fa-solid ${hl.icon} text-8xl"></i>
                            </div>
                            <div class="relative z-10">
                                <h3 class="font-bold text-[1.15rem] text-[#D97D64] mb-2 tracking-wide flex items-center gap-2">
                                    <div class="w-8 h-8 rounded-full bg-[#D97D64] text-white flex items-center justify-center text-sm shadow-sm"><i class="fa-solid ${hl.icon}"></i></div>

                                </h3>

                    `;
                });
                highlightsHtml += `</div>`;
                eventsContainer.insertAdjacentHTML('beforeend', highlightsHtml);

            } else {
                timelineLine.style.display = 'block';
                titleIcon.className = "fa-solid fa-location-dot text-[#D97D64] text-xl";

                dayData.events.forEach((event) => {
                    let transitHtml = '';

                        transitHtml = `
                            <div class="relative flex items-center gap-4 sm:gap-6 my-2 sm:my-3 z-10">
                                <div class="w-12 shrink-0 flex justify-center">
                                    <i class="fa-solid fa-arrow-down-long text-[#DCCDBA] text-sm opacity-70"></i>
                                </div>
                                <div class="bg-[#F4F1EA] text-[#8C8276] border border-[#EBE6DC] shadow-sm px-4 py-1.5 rounded-full text-xs font-semibold flex items-center gap-2">
                                    <i class="fa-solid ${event.transit.icon} text-[#8F9E8B]"></i>
                                    <span>${event.transit.text}</span>
                                </div>
                            </div>
                        `;
                        eventsContainer.insertAdjacentHTML('beforeend', transitHtml);
                    }
                    
                    const linkClasses = event.link 
                        ? "text-[#8F9E8B] hover:text-[#6E7C6A] bg-[#F1F4EE]" 
                        : "text-[#BDB7AE] bg-[#F4F1EA] cursor-not-allowed";
                    
                    const linkText = event.link ? "Google Maps 導航" : "尚未新增連結";
                    const linkTag = event.link 
                        ? `<a href="${event.link}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-2 rounded-xl transition-colors ${linkClasses}"><i class="fa-solid fa-map-location-dot"></i> ${linkText}</a>`
                        : `<span class="inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-2 rounded-xl transition-colors ${linkClasses}"><i class="fa-solid fa-map-location-dot"></i> ${linkText}</span>`;

                    const eventHtml = `
                        <div class="relative flex items-start gap-4 sm:gap-6 group">
                            <div class="flex items-center justify-center w-12 h-12 rounded-full border-[3px] border-[#F9F6F0] bg-[#D97D64] text-white shadow-sm shrink-0 relative z-10 transition-transform group-hover:scale-110 duration-300">
                                <i class="fa-solid ${event.icon} text-lg"></i>
                            </div>
                            
                            <div class="flex-1 bg-white p-5 rounded-[1.5rem] border border-[#EFEBE0] shadow-sm hover:shadow-md transition-shadow">

                    `;
                    eventsContainer.insertAdjacentHTML('beforeend', eventHtml);
                });
            }
            
            renderBottomNav();
        }

        function renderBottomNav() {
            const bottomNav = document.getElementById('bottom-nav-container');
            bottomNav.innerHTML = '';

            let prevBtnHtml = '<div class="w-[30%]"></div>'; 
            if (currentTab > 0) {
                const prevData = itineraryData[currentTab - 1];
                const prevText = prevData.isSummary ? '大綱' : prevData.day;
                prevBtnHtml = `
                    <div class="w-[30%] flex justify-start">
                        <button onclick="switchTab(${currentTab - 1})" class="flex items-center gap-2 text-[#8A8177] hover:text-[#D97D64] transition-colors font-semibold text-sm">
                            <i class="fa-solid fa-chevron-left text-xs"></i> 回到${prevText}
                        </button>
                    </div>
                `;
            }

            let nextBtnHtml = '<div class="w-[30%]"></div>'; 
            if (currentTab < itineraryData.length - 1) {
                const nextData = itineraryData[currentTab + 1];
                nextBtnHtml = `
                    <div class="w-[30%] flex justify-end">
                        <button onclick="switchTab(${currentTab + 1})" class="flex items-center gap-2 bg-[#8F9E8B] text-white px-5 py-2.5 rounded-full hover:bg-[#788874] transition-colors shadow-sm font-semibold text-sm">
                            前往 ${nextData.day} <i class="fa-solid fa-chevron-right text-xs"></i>
                        </button>
                    </div>
                `;
            }

            let topBtnHtml = `
                <div class="w-[40%] flex justify-center">
                    <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="flex flex-col items-center gap-1.5 text-[#DCCDBA] hover:text-[#D97D64] transition-colors font-semibold text-xs group">
                        <div class="w-10 h-10 rounded-full border-[2px] border-[#DCCDBA] group-hover:border-[#D97D64] bg-white flex items-center justify-center transition-colors shadow-sm group-hover:shadow">
                            <i class="fa-solid fa-arrow-up text-lg"></i>
                        </div>
                        <span class="tracking-wider">Top</span>
                    </button>
                </div>
            `;

            bottomNav.innerHTML = prevBtnHtml + topBtnHtml + nextBtnHtml;
        }

        renderTabs();
        renderEvents();
    </script>
